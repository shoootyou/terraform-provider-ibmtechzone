name: Publish to TFC Registry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        type: string
      tfc_org:
        description: "TFC organization to publish to"
        required: true
        type: choice
        default: hashicorp-ddr-platform-dev
        options:
          - hashicorp-ddr-platform-dev
          - hashicorp-ddr-platform-prod
          - hashicorp-wwtfo-demo-platform-dev
          - hashicorp-wwtfo-demo-platform-prod

permissions:
  contents: read

jobs:
  publish:
    name: Publish to TFC Private Registry
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist

      - name: Publish to TFC registry
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          VERSION: ${{ inputs.release_tag }}
          TFC_ORG: ${{ inputs.tfc_org }}
          TFC_PROVIDER: techzone
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          API="https://app.terraform.io/api/v2"
          DIST="dist"

          echo "Creating version ${VERSION} in TFC registry org=${TFC_ORG}..."
          HTTP=$(curl -s -o /tmp/tfc_create.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer ${TFC_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            -d "{\"data\":{\"type\":\"registry-provider-versions\",\"attributes\":{\"version\":\"${VERSION}\",\"key-id\":\"${GPG_KEY_ID}\",\"protocols\":[\"6.0\"]}}}" \
            "${API}/organizations/${TFC_ORG}/registry-providers/private/${TFC_ORG}/${TFC_PROVIDER}/versions")
          if [ "$HTTP" != "201" ]; then
            echo "Failed to create version: HTTP $HTTP"
            cat /tmp/tfc_create.json
            exit 1
          fi

          SHASUMS_UPLOAD=$(python3 -c "import json; print(json.load(open('/tmp/tfc_create.json'))['data']['links']['shasums-upload'])")
          SHASUMS_SIG_UPLOAD=$(python3 -c "import json; print(json.load(open('/tmp/tfc_create.json'))['data']['links']['shasums-sig-upload'])")

          echo "Uploading SHA256SUMS..."
          SHASUMS_FILE=$(ls ${DIST}/*_SHA256SUMS | grep -v '\.sig$')
          SIG_FILE="${SHASUMS_FILE}.sig"
          curl -sf -T "${SHASUMS_FILE}" "${SHASUMS_UPLOAD}"
          curl -sf -T "${SIG_FILE}" "${SHASUMS_SIG_UPLOAD}"
          echo "SHA256SUMS + sig uploaded"

          declare -A PLATFORMS
          PLATFORMS["linux_amd64"]="linux amd64"
          PLATFORMS["linux_arm64"]="linux arm64"
          PLATFORMS["darwin_amd64"]="darwin amd64"
          PLATFORMS["darwin_arm64"]="darwin arm64"
          PLATFORMS["windows_amd64"]="windows amd64"

          for P in "${!PLATFORMS[@]}"; do
            read -r OS ARCH <<< "${PLATFORMS[$P]}"
            ZIP=$(ls ${DIST}/*_${P}.zip 2>/dev/null || true)
            if [ -z "$ZIP" ]; then
              echo "Skipping ${OS}/${ARCH} — no zip found"
              continue
            fi
            FILENAME=$(basename "$ZIP")
            SHA=$(sha256sum "$ZIP" | awk '{print $1}')
            HTTP=$(curl -s -o /tmp/plat_${P}.json -w "%{http_code}" \
              -X POST -H "Authorization: Bearer ${TFC_TOKEN}" \
              -H "Content-Type: application/vnd.api+json" \
              -d "{\"data\":{\"type\":\"registry-provider-version-platforms\",\"attributes\":{\"os\":\"${OS}\",\"arch\":\"${ARCH}\",\"shasum\":\"${SHA}\",\"filename\":\"${FILENAME}\"}}}" \
              "${API}/organizations/${TFC_ORG}/registry-providers/private/${TFC_ORG}/${TFC_PROVIDER}/versions/${VERSION}/platforms")
            if [ "$HTTP" != "201" ]; then
              echo "Failed to create platform ${OS}/${ARCH}: HTTP $HTTP"
              cat /tmp/plat_${P}.json
              exit 1
            fi
            UPLOAD_URL=$(python3 -c "import json; print(json.load(open('/tmp/plat_${P}.json'))['data']['links']['provider-binary-upload'])")
            HTTP2=$(curl -s -o /dev/null -w "%{http_code}" -T "$ZIP" "$UPLOAD_URL")
            echo "  ${OS}/${ARCH}: create=${HTTP} upload=${HTTP2}"
          done

          echo "Verifying upload..."
          RESULT=$(curl -s -H "Authorization: Bearer ${TFC_TOKEN}" \
            "${API}/organizations/${TFC_ORG}/registry-providers/private/${TFC_ORG}/${TFC_PROVIDER}/versions/${VERSION}" | \
            python3 -c "import json,sys; a=json.load(sys.stdin)['data']['attributes']; print(f'shasums={a[\"shasums-uploaded\"]} sig={a[\"shasums-sig-uploaded\"]}')")
          echo "TFC registry verification: $RESULT"
