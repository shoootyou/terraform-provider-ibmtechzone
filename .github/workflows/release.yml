---
# Release workflow — triggers on semver tag push (v*).
#
# Imports the GPG private key from GitHub Actions secrets, then runs GoReleaser
# to produce the signed multi-arch release artifacts required by the TFC private
# provider registry (RFC §8.2, §8.4).
#
# Required GitHub Actions secrets:
#   GPG_PRIVATE_KEY  — armored GPG private key (never committed; managed in
#                      GitHub org/repo secrets or HashiCorp Vault)
#   GPG_FINGERPRINT  — fingerprint of the signing key, passed to `gpg --local-user`
#                      in .goreleaser.yml
#   GITHUB_TOKEN     — automatically provided by GitHub Actions; used by
#                      goreleaser-action to create the GitHub Release
#
# All `uses:` lines are SHA-pinned (40-char commit SHA + version comment).
# The release workflow is intentionally NOT triggered by branch push — see
# RFC §8.2 security acceptance criterion (b): signing only on semver tags.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser Release
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch all tags so GoReleaser can build a correct changelog reference
          # and resolve the tag being released.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GPG_FINGERPRINT is used by .goreleaser.yml signs[].args to select the
          # signing key. The key was imported above by ghaction-import-gpg.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
